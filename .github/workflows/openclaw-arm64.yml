name: OpenClaw exit mutex diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openclaw-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-arm64:
    if: github.repository == 'openclaw/WebKit'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/*
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
            /JSTests/stress/
            /JSTests/modules/
            /JSTests/*.yaml
            /JSTests/BUN-TEST-DIFFERENCES.md
      - name: Install native build and regression tools
        run: |
          curl -fsSL --retry 5 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang-23 lld-23 libicu-dev gdb libc6-dbg ruby ruby-highline libjson-pp-perl
      - name: Build native ARM64 JSC and assembler tests
        run: |
          cmake -S . -B "$RUNNER_TEMP/jsc-build" -G Ninja \
            -DPORT=JSCOnly -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g -fno-omit-frame-pointer -DNDEBUG" -DCMAKE_C_FLAGS_RELEASE="-O2 -g -fno-omit-frame-pointer -DNDEBUG" -DDEVELOPER_MODE=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DENABLE_STATIC_JSC=ON -DUSE_BUN_JSC_ADDITIONS=ON -DUSE_BUN_EVENT_LOOP=ON \
            -DUSE_MIMALLOC=ON -DUSE_EXTERNAL_MIMALLOC=OFF -DENABLE_FTL_JIT=ON \
            -DENABLE_BUN_SKIP_FAILING_ASSERTIONS=ON -DALLOW_LINE_AND_COLUMN_NUMBER_IN_BUILTINS=ON \
            -DENABLE_REMOTE_INSPECTOR=ON -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build "$RUNNER_TEMP/jsc-build" --target jsc -j4
      - name: Capture exit diagnostics
        run: |
          mkdir -m 700 "$RUNNER_TEMP/exit-cores" "$RUNNER_TEMP/exit-proof"
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/exit-cores/core.%p"
          ulimit -c unlimited
          git rev-parse HEAD > "$RUNNER_TEMP/exit-proof/source.log"
          ldd "$RUNNER_TEMP/jsc-build/bin/jsc" > "$RUNNER_TEMP/exit-proof/ldd.log"
          python3 .github/openclaw/exit-mutex-diagnostic.py \
            --binary "$RUNNER_TEMP/jsc-build/bin/jsc" \
            --fixture "$GITHUB_WORKSPACE/JSTests/stress/masquerader-as-function-in-promise.js" \
            --output "$RUNNER_TEMP/exit-proof" --cores "$RUNNER_TEMP/exit-cores"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exit-proof-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/exit-proof/*.json
            ${{ runner.temp }}/exit-proof/*.log
          if-no-files-found: warn
          retention-days: 7
