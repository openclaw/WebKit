name: OpenClaw Darwin diagnostic only

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: darwin-diagnostic-3357-${{ github.ref }}
  cancel-in-progress: false

jobs:
  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 115
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      OPENCLAW_CI_PLATFORM: darwin
    steps:
      - name: Start bounded diagnostic window
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-diagnostic"
          python3 - <<'PY'
          import json,os,pathlib,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'darwin-diagnostic'
          record={'controller':os.environ['GITHUB_SHA'],'engine':'3357f9d63e6dd87a53f2aade723482130a55c0cd','candidate':'dd694cf4c8226ffb24821b6184b1c15ac36c76b7','candidate_tree':'b60f7b8898514913a8125bef65707996fcd88bff','artifact':14018661163,'artifact_run':43378184244,'artifact_sha256':'b01fe234426922e706e11c75a0085ac1c16e4ee4ce6fbb96a1c8df0e7a29288d','deadline':time.time()+6000,'diagnostic_only':True,'shipping_qualified':False}
          (root/'controller.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3357f9d63e6dd87a53f2aade723482130a55c0cd
          path: engine
          persist-credentials: false
          sparse-checkout: .github
      - name: Verify frozen sources without an overlay
        run: |
          test "$(git -C engine rev-parse HEAD)" = 3357f9d63e6dd87a53f2aade723482130a55c0cd
          test "$(git -C engine rev-parse HEAD^{tree})" = d9c63edaafc778bd3c4ae9d610559fac11338d03
          git -C engine diff --exit-code HEAD
          python3 - <<'PY'
          import json,pathlib
          pin=json.loads(pathlib.Path('engine/.github/openclaw/variants.json').read_text())['candidate']
          assert pin['commit']=='dd694cf4c8226ffb24821b6184b1c15ac36c76b7'
          assert pin['tree']=='b60f7b8898514913a8125bef65707996fcd88bff'
          PY
      - name: Read the frozen Bun candidate
        id: consumer
        run: python3 -c 'import json,os; p=json.load(open("engine/.github/openclaw/variants.json"))["candidate"]; print("commit="+p["commit"],file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/bun
          ref: ${{ steps.consumer.outputs.commit }}
          path: consumer/bun
          persist-credentials: false
      - uses: ./consumer/bun/.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Read the candidate toolchain pins
        id: pins
        working-directory: consumer/bun
        run: |
          # shellcheck disable=SC2016
          bun -e 'import { pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm=${pins.llvm.version.split(".")[0]}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_MAJOR: ${{ steps.pins.outputs.llvm }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          python3 -c 'import hashlib; assert callable(hashlib.file_digest)'
          brew install cmake ninja nasm ccache go llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          "$llvm_bin/clang" --version | grep -F "clang version ${LLVM_MAJOR}."
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_bin/clang++" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Download and hash the exact retained archive
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.request,zipfile
          artifact=14018661163
          endpoint=f'https://api.github.com/repos/openclaw/WebKit/actions/artifacts/{artifact}'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(endpoint,headers=headers),timeout=30) as response:
              metadata=json.load(response)
          assert metadata['id']==artifact and metadata['name']=='bun-webkit-macos-arm64-aot' and not metadata['expired']
          assert metadata['workflow_run']['id']==43378184244
          assert metadata['workflow_run']['head_sha']=='3357f9d63e6dd87a53f2aade723482130a55c0cd'
          expected='b01fe234426922e706e11c75a0085ac1c16e4ee4ce6fbb96a1c8df0e7a29288d'
          assert metadata['digest']=='sha256:'+expected
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          try:
              urllib.request.build_opener(NoRedirect).open(urllib.request.Request(endpoint+'/zip',headers=headers),timeout=30)
              raise RuntimeError('Expected artifact redirect')
          except urllib.error.HTTPError as response:
              assert response.code in (301,302,303,307,308)
              location=response.headers['Location']
          assert location.startswith('https://')
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'darwin-input.zip'
          digest=hashlib.sha256()
          # The redirected request deliberately carries no GitHub authorization header.
          with urllib.request.urlopen(location,timeout=60) as response,archive.open('wb') as output:
              while block:=response.read(1024*1024): digest.update(block);output.write(block)
          assert digest.hexdigest()==expected,'Downloaded artifact digest mismatch'
          target=archive.parent/'darwin-artifact'
          with zipfile.ZipFile(archive) as bundle:
              assert all(not pathlib.PurePosixPath(x.filename).is_absolute() and '..' not in pathlib.PurePosixPath(x.filename).parts for x in bundle.infolist())
              bundle.extractall(target)
          archive.unlink()
          print('Verified exact retained archive:',artifact,expected)
          PY
      - name: Observe the unchanged native Darwin qualifier
        timeout-minutes: 105
        working-directory: engine
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/darwin-artifact
          QUALIFICATION_DIR: ${{ github.workspace }}/consumer
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,re,shutil,signal,subprocess,time
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'darwin-diagnostic'
          record=json.loads((out/'controller.json').read_text())
          qualification=pathlib.Path(os.environ['QUALIFICATION_DIR'])
          build=qualification/'bun/build/qualify-candidate'
          env={k:v for k,v in os.environ.items() if not re.search(r'TOKEN|SECRET|PASSWORD|CREDENTIAL|AUTH|PRIVATE_KEY',k,re.I) and not k.startswith(('ACTIONS_','AWS_','AZURE_','SSH_','GIT_CONFIG_')) and k!='GIT_ASKPASS'}
          env['INSPECTOR_RUNTIME']=str(pathlib.Path(shutil.which('bun')).resolve())
          def capture(argv,seconds=10):
              try:
                  p=subprocess.run(argv,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=seconds)
                  return p.stdout[-65536:]
              except Exception as error: return type(error).__name__
          def stamp(): return datetime.datetime.now(datetime.timezone.utc).isoformat()
          versions=[['uname','-a'],['sw_vers'],['sysctl','hw.logicalcpu','hw.physicalcpu','hw.memsize'],['xcodebuild','-version'],['xcrun','--show-sdk-version'],[env['CC'],'--version'],['ninja','--version'],['nasm','--version'],['ccache','--version'],['go','version'],['rustc','--version'],[env['INSPECTOR_RUNTIME'],'--version']]
          (out/'machine.txt').write_text('\n'.join(' '.join(argv)+'\n'+capture(argv) for argv in versions))
          if time.time()>=record['deadline']:
              raise RuntimeError('Setup exhausted the bounded diagnostic window')
          child=subprocess.Popen(['bash','.github/openclaw/qualify-darwin.sh'],env=env,start_new_session=True)
          pgid=child.pid
          (out/'process-owner.json').write_text(json.dumps({'pid':child.pid,'pgid':pgid,'started_at':stamp(),'deadline':record['deadline']}))
          offset=0;sampled=set();ld_seen={};timed_out=False
          def snapshot():
              global offset
              rows=[]
              for line in capture(['ps','-axo','pid=,ppid=,pgid=,%cpu=,rss=,etime=,comm=']).splitlines():
                  fields=line.split(None,6)
                  if len(fields)==7 and fields[2]==str(pgid): rows.append(fields)
              item={'at':stamp(),'pgid':pgid,'processes':rows,'vm_stat':capture(['vm_stat']),'swap':capture(['sysctl','vm.swapusage'])}
              with (out/'samples.jsonl').open('a') as stream: stream.write(json.dumps(item)+'\n')
              log=qualification/'build-candidate.log'
              progress={'at':item['at'],'offset_from':offset,'offset_to':offset,'lines':[]}
              if log.is_file():
                  size=log.stat().st_size
                  with log.open('rb') as stream:
                      stream.seek(max(offset,size-65536));chunk=stream.read(65536)
                  progress.update(offset_to=size,lines=chunk.decode('utf-8','replace').splitlines()[-20:]);offset=size
              print(json.dumps({'progress':progress,'owned_process_count':len(rows)}),flush=True)
              with (out/'progress.jsonl').open('a') as stream: stream.write(json.dumps(progress)+'\n')
              for fields in rows:
                  pid=int(fields[0]);name=pathlib.Path(fields[6]).name
                  if any(x in name.lower() for x in ('clang','ld','rustc','dsymutil')):
                      with (out/'native-argv.log').open('a') as stream:
                          stream.write(item['at']+' '+capture(['ps','-p',str(pid),'-o','pid=,command='])+'\n')
                  if name=='ld':
                      ld_seen.setdefault(pid,time.monotonic())
                      if pid not in sampled and len(sampled)<2 and time.monotonic()-ld_seen[pid]>=120:
                          try:
                              if os.getpgid(pid)==pgid:
                                  sampled.add(pid)
                                  capture(['sample',str(pid),'1','10','-file',str(out/f'ld-{pid}.txt')],5)
                          except ProcessLookupError:
                              pass
          try:
              while child.poll() is None and time.time()<record['deadline']:
                  snapshot()
                  time.sleep(min(60,max(0,record['deadline']-time.time())))
              timed_out=child.poll() is None
              snapshot()
          finally:
              # SIGINT lets the unchanged Python harness run its own cleanup first.
              for sig,grace in ((signal.SIGINT,20),(signal.SIGTERM,10),(signal.SIGKILL,5)):
                  try: os.killpg(pgid,sig)
                  except ProcessLookupError: break
                  try: child.wait(timeout=grace)
                  except subprocess.TimeoutExpired: continue
              child.wait(timeout=5)
              saved=[];omitted=[];total=0
              paths=list(build.rglob('*')) if build.exists() else []
              paths=[p for p in paths if p.is_file() and not p.is_symlink() and (p.name in ('.ninja_log','.ninja_deps') or p.suffix in ('.ninja','.rsp') or 'timing' in p.name.lower())]
              paths+=list(qualification.glob('*.json'))+list(qualification.glob('*.log'))+list(qualification.glob('*.patch'))
              for path in sorted(set(paths)):
                  size=path.stat().st_size;relative=path.relative_to(qualification)
                  if size>32*1024*1024 or total+size>128*1024*1024:
                      omitted.append({'path':str(relative),'bytes':size});continue
                  destination=out/'state'/relative;destination.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(path,destination);saved.append({'path':str(relative),'bytes':size});total+=size
              (out/'outcome.json').write_text(json.dumps({'at':stamp(),'returncode':child.returncode,'deadline_reached':timed_out,'saved':saved,'omitted':omitted,'diagnostic_only':True,'shipping_qualified':False},indent=2)+'\n')
          PY
      - name: Upload bounded diagnostic evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: darwin-diagnostic-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/darwin-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the diagnostic terminal result
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          result=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'darwin-diagnostic/outcome.json').read_text())
          assert result['returncode']==0 and not result['deadline_reached'],'Diagnostic qualifier did not complete; evidence retained, no shipping credit'
          PY
