name: OpenClaw engine checks
on:
  pull_request:
    branches: [openclaw/main, openclaw/release-5718a6ec]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openclaw-engine-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-arm64-build:
    if: github.repository == 'openclaw/WebKit'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.3.0'
      - name: Build unchanged upstream Windows ARM64 lane
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: python3 .github/openclaw/artifacts.py build --lane bun-webkit-windows-arm64 --output "$RUNNER_TEMP/windows-artifact"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-webkit-windows-arm64
          path: ${{ runner.temp }}/windows-artifact
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  windows-arm64:
    needs: windows-arm64-build
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github
            JSTests/stress
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bun-webkit-windows-arm64
          path: ${{ runner.temp }}/windows-artifact
      - name: Qualify native ARM64 engine
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.github/openclaw/qualify-windows-arm64.ps1 -ArtifactDirectory "$env:RUNNER_TEMP/windows-artifact" -OutputDirectory "$env:RUNNER_TEMP/windows-proof" -Source $env:EXPECTED_SOURCE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-arm64-qualification
          path: |
            ${{ runner.temp }}/windows-proof/gate.json
            ${{ runner.temp }}/windows-proof/accounting-*.log
          if-no-files-found: error
          retention-days: 7
  linux-native:
    if: github.repository == 'openclaw/WebKit'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/*
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
            /JSTests/stress/
            /JSTests/modules/
            /JSTests/*.yaml
            /JSTests/BUN-TEST-DIFFERENCES.md
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.3.0'
      - name: Bind the historical baseline Node reference
        run: |
          test "$(node --version)" = v26.3.0
          echo "BASELINE_REFERENCE_NODE=$(realpath "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Bind the candidate Node reference
        run: |
          test "$(node --version)" = v26.12.1
          echo "CANDIDATE_REFERENCE_NODE=$(realpath "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Verify pipeline integrity and runner support
        run: |
          python3 .github/openclaw/test_artifacts.py
          python3 .github/openclaw/test_compare_fork_ci.py
          python3 .github/openclaw/test_release.py
          python3 .github/openclaw/test_consumer_identity.py
          python3 .github/openclaw/test_verify_jsc_results.py
          bash .github/openclaw/preflight.sh
      - name: Build native Linux engine with the unchanged lane
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: python3 .github/openclaw/artifacts.py build --lane bun-webkit-linux-amd64 --output "$RUNNER_TEMP/linux-artifact"
      - name: Retain native Linux engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-webkit-linux-amd64
          path: ${{ runner.temp }}/linux-artifact
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Build native Linux AOT engine for the current Bun candidate
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: python3 .github/openclaw/artifacts.py build --lane bun-webkit-linux-amd64-aot --output "$RUNNER_TEMP/linux-aot-artifact"
      - name: Retain native Linux AOT engine artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-webkit-linux-amd64-aot
          path: ${{ runner.temp }}/linux-aot-artifact
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Install pinned Bun and JSC test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm ccache golang-go unzip ruby ruby-highline libjson-pp-perl
          tools="$RUNNER_TEMP/bun-tools"
          mkdir -p "$tools/llvm" "$tools/cmake"
          curl -fSL --retry 5 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz -o "$tools/llvm.tar.xz"
          echo '832aeb58d105de1cabc7b982dd2c65de0610f7377df48ae8fc2dd8e97420a15c  '"$tools/llvm.tar.xz" | sha256sum -c -
          tar -xJf "$tools/llvm.tar.xz" --strip-components=1 -C "$tools/llvm" LLVM-23.1.1-Linux-X64/bin LLVM-23.1.1-Linux-X64/lib/clang/23
          curl -fSL --retry 5 https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb -o "$tools/libicu70.deb"
          echo '58a154f6307289813da2276f900498ef536ae7c0522d2cf31a3c3c5cf62dfd9a  '"$tools/libicu70.deb" | sha256sum -c -
          sudo dpkg -i "$tools/libicu70.deb"
          curl -fSL --retry 5 https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.sh -o "$tools/cmake.sh"
          echo '83de8839f3fb0d9caf982a0435da3fa8c4fbe2c817dfec99def310dc7e6a8404  '"$tools/cmake.sh" | sha256sum -c -
          sh "$tools/cmake.sh" --skip-license --prefix="$tools/cmake"
          rustup toolchain install nightly-2026-09-15 --profile minimal --component rust-src
          echo 'RUSTUP_TOOLCHAIN=nightly-2026-09-15' >> "$GITHUB_ENV"
          echo "$tools/llvm/bin" >> "$GITHUB_PATH"
          echo "$tools/cmake/bin" >> "$GITHUB_PATH"
          curl -fSL --retry 5 https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip -o "$RUNNER_TEMP/bun.zip"
          echo 'bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c  '"$RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bootstrap"
          echo "$RUNNER_TEMP/bootstrap/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Qualify the exact Bun candidate and fork selection
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/linux-aot-artifact
          QUALIFICATION_DIR: ${{ runner.temp }}/qualification
        run: |
          export INSPECTOR_RUNTIME="$(realpath "$(command -v bun)")"
          ARTIFACT_DIR="$RUNNER_TEMP/linux-artifact" bash .github/openclaw/qualify-engine.sh
          bash .github/openclaw/qualify.sh
          export CANDIDATE_BUN="$QUALIFICATION_DIR/bun/build/qualify-candidate/bun"
          export CANDIDATE_RECEIPT="$QUALIFICATION_DIR/candidate-identity.json"
          bash .github/openclaw/qualify-sync-compatibility.sh
          bash .github/openclaw/qualify-sync.sh
      - name: Retain qualified Linux Bun executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-bun-executables
          path: |
            ${{ runner.temp }}/qualification/bun-baseline/build/qualify-baseline/bun
            ${{ runner.temp }}/qualification/bun/build/qualify-candidate/bun
            ${{ runner.temp }}/qualification/bun/build/qualify-candidate/obj/vendor/mimalloc/src/static.c.o
            ${{ runner.temp }}/qualification/bun/test/js/node/worker_threads/openclaw-resource-limits.test.ts
            ${{ runner.temp }}/qualification/bun/test/aot/every-platform.test.ts
            ${{ runner.temp }}/qualification/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: linux-native-proof
          path: |
            ${{ runner.temp }}/qualification/*.json
            ${{ runner.temp }}/qualification/*.log
            ${{ runner.temp }}/qualification/*.sha256
            ${{ runner.temp }}/qualification/*.patch
            ${{ runner.temp }}/qualification/candidate-input/artifacts.json
            ${{ runner.temp }}/qualification/baseline/*.json
            ${{ runner.temp }}/qualification/baseline/*.log
            ${{ runner.temp }}/qualification/candidate/*.json
            ${{ runner.temp }}/qualification/candidate/*.log
            ${{ runner.temp }}/qualification/compatibility/*.log
            ${{ runner.temp }}/qualification/sync/*.json
            ${{ runner.temp }}/qualification/sync/*.xml
            ${{ runner.temp }}/qualification/sync/*.log
            ${{ runner.temp }}/qualification/jsc-*/results
            ${{ runner.temp }}/qualification/jsc-stack/*.log
            ${{ runner.temp }}/qualification/jsc-stack/*.json
            ${{ runner.temp }}/qualification/sync/runtime-cache/*.json
          if-no-files-found: error
          retention-days: 7
  macos-fork-artifact:
    if: github.repository == 'openclaw/WebKit'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/*
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.3.0'
      - name: Build the macOS fork artifact on Linux without publishing
        run: python3 .github/openclaw/artifacts.py build --lane bun-webkit-macos-arm64 --output "$RUNNER_TEMP/macos-fork-artifact"
