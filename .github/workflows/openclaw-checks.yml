name: ARM64 accounting before-fix proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  before:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            JSTests/stress
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bun-webkit-windows-arm64
          run-id: 37293130816
          github-token: ${{ github.token }}
          path: input
      - name: Probe exact before-fix native ARM64 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'Expected native ARM64' }
          $archive = 'input/bun-webkit-windows-arm64.tar.gz'
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($digest -cne 'dbe30b56af503584b2fc512c1669217bb8ef7daf4d155fb614387d219052b9b7') { throw 'Wrong baseline archive' }
          New-Item -ItemType Directory -Path unpacked,proof | Out-Null
          tar -xzf $archive -C unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          $jsc = (Resolve-Path 'unpacked/bun-webkit/bin/jsc.exe').Path
          $bytes = [IO.File]::ReadAllBytes($jsc)
          if ([BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4) -ne 0xaa64) { throw 'Not ARM64 PE' }
          $modes = @(
            @{ Name='interpreter'; Flags=@('--useJIT=false') },
            @{ Name='baseline'; Flags=@('--useDFGJIT=false','--useFTLJIT=false') },
            @{ Name='dfg'; Flags=@('--useFTLJIT=false','--useConcurrentJIT=false') },
            @{ Name='ftl'; Flags=@('--useConcurrentJIT=false','--thresholdForJITAfterWarmUp=10','--thresholdForOptimizeAfterWarmUp=20','--thresholdForFTLOptimizeAfterWarmUp=20') },
            @{ Name='concurrent'; Flags=@('--gcAtEnd=true','--useConcurrentGC=true') }
          )
          $results = @{}
          foreach ($mode in $modes) {
            $flags = @('--useGenerationalGC=true','--forceMiniVMMode=false') + $mode.Flags
            & $jsc @flags 'JSTests/stress/array-buffer-accounting.js' *> "proof/$($mode.Name).log"
            $results[$mode.Name] = $LASTEXITCODE
            Get-Content "proof/$($mode.Name).log"
          }
          @{ archiveSha256=$digest; source='8b1a979c5ac866d8c927c3d7a0179b2002185f7d'; architecture='arm64'; results=$results } | ConvertTo-Json | Set-Content proof/before.json
          if ($results.interpreter -ne 0 -or $results.baseline -ne 0 -or $results.dfg -eq 0) { throw 'Expected interpreter/baseline pass and DFG regression' }
          if ((Get-Content -Raw proof/dfg.log) -notmatch 'allocation') { throw 'DFG failed for an unexpected reason' }
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: before-arm64-accounting
          path: proof
          if-no-files-found: error
