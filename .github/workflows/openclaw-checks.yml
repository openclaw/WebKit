name: ARM64 accounting artifact replay
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Engine artifact workflow run
        type: string
        required: true
      source:
        description: Full engine source SHA from artifact manifest
        type: string
        required: true
      archive_sha256:
        description: Independently verified ARM64 archive SHA256
        type: string
        required: true
      expect_failure:
        description: Require the known before-fix forced-optimization undercount
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  accounting:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            JSTests/stress
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bun-webkit-windows-arm64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: input
      - name: Probe exact native ARM64 archive
        shell: pwsh
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
          EXPECTED_SHA256: ${{ inputs.archive_sha256 }}
          EXPECT_FAILURE: ${{ inputs.expect_failure }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:EXPECTED_SOURCE -cnotmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid exact-source inputs' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'Expected native ARM64' }
          $archive = 'input/bun-webkit-windows-arm64.tar.gz'
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $manifest = Get-Content -Raw input/bun-webkit-windows-arm64.manifest.json | ConvertFrom-Json
          if ($digest -cne $env:EXPECTED_SHA256 -or $manifest.source -cne $env:EXPECTED_SOURCE -or $manifest.lane.label -cne 'bun-webkit-windows-arm64' -or $manifest.files.'bun-webkit-windows-arm64.tar.gz'.sha256 -cne $digest) { throw 'Wrong source or archive' }
          New-Item -ItemType Directory -Path unpacked,proof | Out-Null
          tar -xzf $archive -C unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          $jsc = (Resolve-Path 'unpacked/bun-webkit/bin/jsc.exe').Path
          $bytes = [IO.File]::ReadAllBytes($jsc)
          if ([BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4) -ne 0xaa64) { throw 'Not ARM64 PE' }
          $modes = @(
            @{ Name='interpreter'; Flags=@('--useJIT=false') },
            @{ Name='baseline'; Flags=@('--useDFGJIT=false','--useFTLJIT=false') },
            @{ Name='dfg'; Flags=@('--useFTLJIT=false','--useConcurrentJIT=false') },
            @{ Name='ftl'; Flags=@('--useConcurrentJIT=false','--thresholdForJITAfterWarmUp=10','--thresholdForOptimizeAfterWarmUp=20','--thresholdForFTLOptimizeAfterWarmUp=20') },
            @{ Name='concurrent'; Flags=@('--gcAtEnd=true','--useConcurrentGC=true') }
          )
          $results = @{}
          foreach ($mode in $modes) {
            $flags = @('--useGenerationalGC=true','--forceMiniVMMode=false') + $mode.Flags
            & $jsc @flags 'JSTests/stress/array-buffer-accounting.js' *> "proof/$($mode.Name).log"
            $results[$mode.Name] = $LASTEXITCODE
            Get-Content "proof/$($mode.Name).log"
          }
          $fixtureHash = (Get-FileHash -Algorithm SHA256 JSTests/stress/array-buffer-accounting.js).Hash.ToLowerInvariant()
          @{ archiveSha256=$digest; source=$env:EXPECTED_SOURCE; run=$env:SOURCE_RUN; architecture='arm64'; fixtureSha256=$fixtureHash; expectedFailure=($env:EXPECT_FAILURE -eq 'true'); results=$results } | ConvertTo-Json | Set-Content proof/accounting.json
          if ($env:EXPECT_FAILURE -eq 'true') {
            if ($results.interpreter -ne 0 -or $results.baseline -ne 0 -or $results.ftl -eq 0) { throw 'Expected interpreter/baseline pass and forced-optimization regression' }
            $log = Get-Content -Raw proof/ftl.log
            if ($log -notmatch 'young vector allocation: (\d+) !== 256000' -or [int]$Matches[1] -le 0 -or [int]$Matches[1] -ge 256000) { throw 'Unexpected before-fix failure' }
          } elseif (@($results.Values | Where-Object { $_ -ne 0 }).Count -ne 0) {
            throw 'Corrected engine must pass all five configured modes'
          }
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-arm64-accounting
          path: proof
          if-no-files-found: error
