name: OpenClaw repaired Bun native Darwin qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ENGINE_SHA: 1281a1be4796f541bcaf0ef751941c41dfbf7817
concurrency:
  group: openclaw-c6-darwin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'openclaw/WebKit' && github.ref == 'refs/heads/claude/bun-c6a7-darwin-qualification-20261102'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ENGINE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/*
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Measure existing runner and Docker capacity
        run: bash .github/openclaw/preflight.sh
      - name: Build unchanged upstream lane and record provenance
        env:
          LANE: bun-webkit-macos-arm64-aot
          BUILDX_METADATA_PROVENANCE: max
        run: python3 .github/openclaw/artifacts.py build --lane "$LANE" --output "$RUNNER_TEMP/lane"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bun-webkit-macos-arm64-aot
          path: ${{ runner.temp }}/lane
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  darwin-arm64:
    needs: build
    runs-on: macos-15
    timeout-minutes: 115
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      OPENCLAW_CI_PLATFORM: darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1281a1be4796f541bcaf0ef751941c41dfbf7817
          persist-credentials: false
          sparse-checkout: |
            .github
            icu
            macos-cross
            Source/JavaScriptCore
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: qualification-controls
          persist-credentials: false
          sparse-checkout: .github/openclaw
      - name: Admit the exact current controls over the frozen engine checkout
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 - <<'PY'
          import hashlib, json, os, stat, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          controls = root / 'qualification-controls'
          def git(repo, *args):
              return subprocess.check_output(['git', '-C', str(repo), *args], text=True, timeout=120).strip()
          assert git(root, 'rev-parse', 'HEAD') == '1281a1be4796f541bcaf0ef751941c41dfbf7817'
          assert git(controls, 'rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          names = [name for name in git(controls, 'ls-files', '-z', '--', '.github/openclaw').split('\0') if name]
          assert 0 < len(names) <= 512 and sum((controls / name).stat().st_size for name in names) < 64 * 1024**2
          installed = {}
          for name in names:
              source, target = controls / name, root / name
              assert stat.S_ISREG(source.lstat().st_mode)
              indexed = git(controls, 'ls-files', '-s', '--', name).split()
              data = source.read_bytes()
              assert indexed[0] in ('100644', '100755')
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == indexed[1]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(0o755 if indexed[0] == '100755' else 0o644)
              installed[name] = hashlib.sha256(data).hexdigest()
          proof = root / 'consumer'
          proof.mkdir()
          (proof / 'continuation-inputs.json').write_text(json.dumps({
              'engine': '1281a1be4796f541bcaf0ef751941c41dfbf7817', 'controls': os.environ['GITHUB_SHA'],
              'installed_controls': installed, 'bun_native_qualification': 'pending',
          }, indent=2) + '\n')
          PY
      - name: Read the frozen Bun candidate
        id: consumer
        run: python3 -c 'import json,os; p=json.load(open(".github/openclaw/variants.json"))["candidate"]; print("commit="+p["commit"],file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - name: Admit the exact Bun source snapshot for native qualification
        run: |
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          mkdir -p consumer
          python3 .github/openclaw/qualification/acquire-bun-snapshot.py consumer/bun > consumer/candidate-source.json
          test "$(git -C consumer/bun rev-parse HEAD)" = "${{ steps.consumer.outputs.commit }}"
      - uses: ./consumer/bun/.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Read the candidate toolchain pins
        id: pins
        working-directory: consumer/bun
        run: |
          # shellcheck disable=SC2016
          bun -e 'import { pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm=${pins.llvm.version.split(".")[0]}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_MAJOR: ${{ steps.pins.outputs.llvm }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          python3 -c 'import hashlib; assert callable(hashlib.file_digest)'
          brew install cmake ninja nasm ccache go llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          "$llvm_bin/clang" --version | grep -F "clang version ${LLVM_MAJOR}."
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_bin/clang++" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bun-webkit-macos-arm64-aot
          path: ${{ runner.temp }}/darwin-artifact
      - name: Build and qualify the exact native Darwin candidate
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/darwin-artifact
          QUALIFICATION_DIR: ${{ github.workspace }}/consumer
        run: |
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          export INSPECTOR_RUNTIME="$(python3 -c 'import pathlib,shutil; print(pathlib.Path(shutil.which("bun")).resolve())')"
          bash .github/openclaw/qualify-darwin.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: darwin-bun-executables
          path: |
            ${{ github.workspace }}/consumer/bun/build/qualify-candidate/bun
            ${{ github.workspace }}/consumer/bun/test/js/node/worker_threads/openclaw-resource-limits.test.ts
            ${{ github.workspace }}/consumer/bun/test/aot/every-platform.test.ts
            ${{ github.workspace }}/consumer/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: darwin-qualification
          path: |
            ${{ github.workspace }}/consumer/*.json
            ${{ github.workspace }}/consumer/*.log
            ${{ github.workspace }}/consumer/*.patch
            ${{ github.workspace }}/consumer/candidate-input/artifacts.json
            ${{ github.workspace }}/consumer/candidate/*.json
            ${{ github.workspace }}/consumer/candidate/*.log
            ${{ github.workspace }}/consumer/sync/*.log
          if-no-files-found: error
          retention-days: 7
