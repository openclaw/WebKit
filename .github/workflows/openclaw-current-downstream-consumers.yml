name: OpenClaw current downstream Bun consumer qualification

on:
  push:
    branches: [claude/hosted-linux-consumer-20261031]
    paths:
      - .github/workflows/openclaw-current-downstream-consumers.yml
      - .github/openclaw/qualification/downstream-consumers.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openclaw-current-downstream-consumers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: controls
          sparse-checkout: .github
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e586e4ce8bd9f3f3703af98983f7f13fb58c242
          persist-credentials: false
          path: carrier
          sparse-checkout: .github
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 2952110b2a14efac009e1cc5fb758cd8ed15d193
          persist-credentials: false
          path: openclaw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/birdclaw
          ref: 59c9ee27f39238654efc93ff7862b27ad474c044
          persist-credentials: false
          path: birdclaw
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Install the pinned package manager and check smoke prerequisites
        run: |
          set -euo pipefail
          npm install --global pnpm@12.15.0
          test "$(node --version)" = v26.12.1
          test "$(pnpm --version)" = 12.15.0
          test -x /usr/bin/google-chrome
          command -v unshare setpriv >/dev/null
          sudo -n true
      - name: Admit the exact qualified binary and its original receipt
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controls/.github/openclaw/qualification/downstream-consumers.py admit
      - name: Qualify the OpenClaw package, launcher and SQLite boundaries
        working-directory: openclaw
        env:
          OPENCLAW_TEST_BUN_LAUNCHER: '1'
          OPENCLAW_BUN_ONLY_SMOKE_HIDE_SYSTEM_NODE: '1'
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 "$GITHUB_WORKSPACE/controls/.github/openclaw/qualification/downstream-consumers.py" identity
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/downstream-proof/openclaw-install.log"
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog --output-dir "$RUNNER_TEMP/package" --output-name candidate.tgz 2>&1 | tee "$RUNNER_TEMP/downstream-proof/openclaw-package.log"
          export OPENCLAW_BUN_ONLY_SMOKE_PACKAGE_TGZ="$RUNNER_TEMP/package/candidate.tgz"
          export OPENCLAW_BUN_ONLY_SMOKE_ARTIFACT_DIR="$RUNNER_TEMP/downstream-proof/openclaw-smoke"
          /bin/bash scripts/e2e/bun-only-runtime-smoke.sh 2>&1 | tee "$RUNNER_TEMP/downstream-proof/openclaw-smoke.log"
          pnpm test src/infra/sqlite-existing-database.bun.test.ts src/infra/sqlite-worker-input.bun.test.ts -- --reporter=json --outputFile="$RUNNER_TEMP/downstream-proof/openclaw-sqlite.json" 2>&1 | tee "$RUNNER_TEMP/downstream-proof/openclaw-sqlite.log"
          python3 "$GITHUB_WORKSPACE/controls/.github/openclaw/qualification/downstream-consumers.py" openclaw
      - name: Qualify Birdclaw SQLite, migrations, CLI and production server
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        working-directory: birdclaw
        env:
          BIRDCLAW_BACKUP_AUTO_SYNC: '0'
          BIRDCLAW_DISABLE_LIVE_PROFILE_LOOKUP: '1'
          BIRDCLAW_DISABLE_LIVE_WRITES: '1'
          DO_NOT_TRACK: '1'
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 "$GITHUB_WORKSPACE/controls/.github/openclaw/qualification/downstream-consumers.py" identity
          export BIRDCLAW_HOME="$RUNNER_TEMP/birdclaw-home"
          "$BUN_BIN" --no-env-file install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/downstream-proof/birdclaw-install.log"
          "$BUN_BIN" --no-env-file run --bun build 2>&1 | tee "$RUNNER_TEMP/downstream-proof/birdclaw-build.log"
          "$BUN_BIN" --no-env-file scripts/run-vitest.mjs run src/lib/sqlite.test.ts src/lib/database-migrations.test.ts src/lib/production-server.test.ts --reporter=json --outputFile="$RUNNER_TEMP/downstream-proof/birdclaw-vitest.json" 2>&1 | tee "$RUNNER_TEMP/downstream-proof/birdclaw-vitest.log"
          "$BUN_BIN" --no-env-file bin/birdclaw.mjs --json init --demo > "$RUNNER_TEMP/downstream-proof/birdclaw-init.json"
          "$BUN_BIN" --no-env-file scripts/runtime-perf.mjs --label=current-engine-consumer --runtime="$BUN_BIN" --runtime-arg=--no-env-file --entry=bin/birdclaw.mjs --home="$BIRDCLAW_HOME" --iterations=1 --git-sha=59c9ee27f39238654efc93ff7862b27ad474c044 > "$RUNNER_TEMP/downstream-proof/birdclaw-runtime.json" 2> "$RUNNER_TEMP/downstream-proof/birdclaw-runtime.log"
          python3 "$GITHUB_WORKSPACE/controls/.github/openclaw/qualification/downstream-consumers.py" birdclaw
      - name: Seal both consumer results
        run: |
          set -euo pipefail
          python3 controls/.github/openclaw/qualification/downstream-consumers.py openclaw
          python3 controls/.github/openclaw/qualification/downstream-consumers.py birdclaw
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: current-downstream-consumer-proof
          path: ${{ runner.temp }}/downstream-proof
          if-no-files-found: warn
          retention-days: 7
