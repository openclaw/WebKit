name: OpenClaw current Linux consumer continuation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: openclaw-current-linux-consumer-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'
jobs:
  current-consumer:
    if: github.repository == 'openclaw/WebKit' && github.ref == 'refs/heads/claude/bun-c6a7-native-qualification-20261102'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1281a1be4796f541bcaf0ef751941c41dfbf7817
          path: pipeline
          persist-credentials: false
          sparse-checkout: |
            .github
            icu
            macos-cross
            Source/JavaScriptCore
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
          sparse-checkout: .github/openclaw
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.3.0'
      - name: Bind the historical baseline Node reference
        run: |
          test "$(node --version)" = v26.3.0
          echo "BASELINE_REFERENCE_NODE=$(realpath "$(command -v node)")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Bind the candidate Node reference
        run: |
          test "$(node --version)" = v26.12.1
          echo "CANDIDATE_REFERENCE_NODE=$(realpath "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Install pinned Bun and JSC test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm ccache golang-go unzip ruby ruby-highline libjson-pp-perl
          tools="$RUNNER_TEMP/bun-tools"
          mkdir -p "$tools/llvm" "$tools/cmake"
          curl -fSL --retry 5 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz -o "$tools/llvm.tar.xz"
          echo '832aeb58d105de1cabc7b982dd2c65de0610f7377df48ae8fc2dd8e97420a15c  '"$tools/llvm.tar.xz" | sha256sum -c -
          tar -xJf "$tools/llvm.tar.xz" --strip-components=1 -C "$tools/llvm" LLVM-23.1.1-Linux-X64/bin LLVM-23.1.1-Linux-X64/lib/clang/23
          curl -fSL --retry 5 https://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb -o "$tools/libicu70.deb"
          echo '58a154f6307289813da2276f900498ef536ae7c0522d2cf31a3c3c5cf62dfd9a  '"$tools/libicu70.deb" | sha256sum -c -
          sudo dpkg -i "$tools/libicu70.deb"
          curl -fSL --retry 5 https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.sh -o "$tools/cmake.sh"
          echo '83de8839f3fb0d9caf982a0435da3fa8c4fbe2c817dfec99def310dc7e6a8404  '"$tools/cmake.sh" | sha256sum -c -
          sh "$tools/cmake.sh" --skip-license --prefix="$tools/cmake"
          rustup toolchain install nightly-2026-09-15 --profile minimal --component rust-src
          echo 'RUSTUP_TOOLCHAIN=nightly-2026-09-15' >> "$GITHUB_ENV"
          echo "$tools/llvm/bin" >> "$GITHUB_PATH"
          echo "$tools/cmake/bin" >> "$GITHUB_PATH"
          curl -fSL --retry 5 https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip -o "$RUNNER_TEMP/bun.zip"
          echo 'bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c  '"$RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bootstrap"
          echo "$RUNNER_TEMP/bootstrap/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Download the fixed engine archives from their original run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'retained-engine')
          root.mkdir()
          for name, identity in [('native', 13100940398), ('aot', 13101342737)]:
              for suffix, route in [('metadata.json', ''), ('zip', '/zip')]:
                  with (root / (name + '.' + suffix)).open('xb') as output:
                      subprocess.run(['gh', 'api', f'repos/openclaw/WebKit/actions/artifacts/{identity}{route}'],
                                     stdout=output, check=True, timeout=600)
          PY
      - name: Admit retained engine bytes and the exact current controls
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 ../controls/.github/openclaw/qualification/stage-current-sync.py
      - name: Build and qualify the repaired Bun snapshot with the canonical gates
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/linux-aot-artifact
          QUALIFICATION_DIR: ${{ runner.temp }}/qualification
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          export INSPECTOR_RUNTIME="$(realpath "$(command -v bun)")"
          bash .github/openclaw/qualify.sh
          export CANDIDATE_BUN="$QUALIFICATION_DIR/bun/build/qualify-candidate/bun"
          export CANDIDATE_RECEIPT="$QUALIFICATION_DIR/candidate-identity.json"
          bash .github/openclaw/qualify-sync-compatibility.sh
          bash .github/openclaw/qualify-sync.sh
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['QUALIFICATION_DIR'])
          assert json.loads((root / 'gate.json').read_text())['passed']
          assert json.loads(Path('.github/openclaw/variants.json').read_text())['candidate']['commit'] == 'c6a7bf9d8dc4d44db9f826e47a5ae7645ea6e8c9'
          with (root / 'candidate-identity.json').open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          (root / 'current-sync-gate.json').write_text(json.dumps({
              'passed': True, 'engine': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'bun': 'c6a7bf9d8dc4d44db9f826e47a5ae7645ea6e8c9', 'controls': os.environ['GITHUB_SHA'],
              'candidate_identity_sha256': digest, 'engine_artifacts_and_native_runtime_proof': 'reused from run41348390908',
              'scope': 'fresh Linux AOT Release Bun and canonical baseline/compatibility/sync gates; no Darwin or namespace-port verdict',
          }, indent=2) + '\n')
          PY
      - name: Retain the exact Bun executables and allocator object
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-sync-linux-executables
          path: |
            ${{ runner.temp }}/qualification/bun-baseline/build/qualify-baseline/bun
            ${{ runner.temp }}/qualification/bun/build/qualify-candidate/bun
            ${{ runner.temp }}/qualification/bun/build/qualify-candidate/obj/vendor/mimalloc/src/static.c.o
            ${{ runner.temp }}/qualification/bun/test/js/node/worker_threads/openclaw-resource-limits.test.ts
            ${{ runner.temp }}/qualification/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Retain original source, command and native result identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-sync-linux-proof
          path: |
            ${{ runner.temp }}/qualification/*.json
            ${{ runner.temp }}/qualification/*.log
            ${{ runner.temp }}/qualification/*.sha256
            ${{ runner.temp }}/qualification/*.patch
            ${{ runner.temp }}/qualification/candidate-input/artifacts.json
            ${{ runner.temp }}/qualification/baseline/*.json
            ${{ runner.temp }}/qualification/baseline/*.log
            ${{ runner.temp }}/qualification/candidate/*.json
            ${{ runner.temp }}/qualification/candidate/*.log
            ${{ runner.temp }}/qualification/compatibility/*.log
            ${{ runner.temp }}/qualification/sync/*.json
            ${{ runner.temp }}/qualification/sync/*.xml
            ${{ runner.temp }}/qualification/sync/*.log
            ${{ runner.temp }}/qualification/sync/runtime-cache/*.json
            ${{ runner.temp }}/qualification/jsc-*/results
            ${{ runner.temp }}/qualification/jsc-stack/*.log
            ${{ runner.temp }}/qualification/jsc-stack/*.json
          retention-days: 7
          if-no-files-found: warn
