name: OpenClaw current retained matrix assembly

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: openclaw-current-retained-matrix-41330085617
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4430cc2e4caa5720c2f78963be3566c87b958084
          path: pipeline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            Source/JavaScriptCore/COPYING.LIB
            Source/WTF/wtf/COPYING.LIB
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
          sparse-checkout: .github/openclaw
      - name: Admit the completed 21 builds and exact fresh Linux proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 carrier/.github/openclaw/qualification/assemble-retained-matrix.py current21 "$RUNNER_TEMP/inputs" "$GITHUB_WORKSPACE/pipeline"
      - name: Assemble and verify all 22 immutable archives
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          cd pipeline
          python3 .github/openclaw/release.py assemble --source 4430cc2e4caa5720c2f78963be3566c87b958084 --inputs "$RUNNER_TEMP/inputs" --directory "$RUNNER_TEMP/assembled"
          python3 .github/openclaw/release.py verify --source 4430cc2e4caa5720c2f78963be3566c87b958084 --directory "$RUNNER_TEMP/assembled"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-retained-matrix-assembly
          path: ${{ runner.temp }}/assembled
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: current-retained-matrix-assembly-receipts
          path: |
            ${{ runner.temp }}/inputs/assembly-inputs.json
            ${{ runner.temp }}/assembled/manifest.json
            ${{ runner.temp }}/assembled/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
