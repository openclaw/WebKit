name: OpenClaw current ordinary Bun VM debug proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openclaw-current-bun-vm-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-x64:
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controls
          ref: 0e5b180de777933c359ef7bdb4d4f6d4a3e58522
          persist-credentials: false
          sparse-checkout: .github/openclaw/qualification
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/bun
          ref: 7b573c05d0c52dffc67d4d25daf108bed5930cf2
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/bun
          ref: d9be087429c21e563bb5ac29f8a11805e64b56a3
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4430cc2e4caa5720c2f78963be3566c87b958084
          path: engine
          persist-credentials: false
      - uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: '1.4.4'
      - name: Generate the frozen provisioning script
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          mkdir vm-debug-proof
          bun pipeline/scripts/build/ci-images/spec.ts linux-x64-debian
          script=$(bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { resolve, join } from "node:path";
            import { provisionScript, sectionsFor } from "./pipeline/scripts/openclaw-release/release.ts";
            const dir = resolve("pipeline/build/ci-images/linux-x64-debian");
            const out = join(dir, "openclaw-provision.sh");
            writeFileSync(out, provisionScript(readFileSync(join(dir, "bootstrap.sh"), "utf8"), sectionsFor([])));
            console.log(out);
          ')
          test -f "$script"
          script_relative=${script#"$GITHUB_WORKSPACE/"}
          test "$script_relative" != "$script"
          echo "script=/work/$script_relative" >> "$GITHUB_OUTPUT"
      - name: Provision the pinned native x64 toolchain
        id: container
        timeout-minutes: 45
        shell: bash
        env:
          SCRIPT: ${{ steps.provision.outputs.script }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -1)" -ge 68719476736
          cat /proc/meminfo > vm-debug-proof/runner-memory.log
          df -B1 "$GITHUB_WORKSPACE" > vm-debug-proof/runner-disk.log
          container_id=$(docker run --detach --name bun-vm-debug-consumer -e CI=true -v "$GITHUB_WORKSPACE:/work" -w /work \
            docker.io/library/debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c sleep infinity)
          echo "id=$container_id" >> "$GITHUB_OUTPUT"
          docker exec -e SCRIPT bun-vm-debug-consumer sh -euc 'sh "$SCRIPT" d9be087429c21e563bb5ac29f8a11805e64b56a3 openclaw-release'
          docker exec bun-vm-debug-consumer sh -euc 'apt-get update; apt-get install --yes --no-install-recommends python3 ruby bison gawk perl libxml2-dev pkg-config libicu-dev'
      - name: Run the required VM debug build and test
        shell: bash
        run: |
          set -euo pipefail
          docker exec bun-vm-debug-consumer bash -e -lc '
            . /etc/profile.d/bun-ci.sh
            for repo in /work/source /work/engine /work/pipeline; do git config --global --add safe.directory "$repo"; done
            unset CI BUILDKITE GITHUB_ACTIONS GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
            export BUN_WEBKIT_PATH=/work/engine CMAKE_BUILD_PARALLEL_LEVEL=2 CARGO_BUILD_JOBS=2
            python3 /work/controls/.github/openclaw/qualification/debug-vm-consumer.py prepare
            cd /work/source
            bun install --frozen-lockfile
            (cd test && bun install --frozen-lockfile)
            bun bd --webkit=local --webkit-version=4430cc2e4caa5720c2f78963be3566c87b958084 --ci=off --buildkite=off --build-dir=build/debug-prepush -j2 test --expose-internals -t "shared source buffers survive compilation-cache eviction:" --reporter=junit --reporter-outfile=/work/vm-debug-proof/vm-junit.xml test/js/node/vm/vm.test.ts > /work/vm-debug-proof/command.log 2>&1
            python3 /work/controls/.github/openclaw/qualification/debug-vm-consumer.py verify
          '
      - name: Retain bounded source and native proof
        if: always()
        shell: bash
        env:
          CONTAINER_ID: ${{ steps.container.outputs.id }}
        run: |
          set -euo pipefail
          if test -n "$CONTAINER_ID"; then
            [[ "$CONTAINER_ID" =~ ^[0-9a-f]{64}$ ]]
            docker stop --time 30 "$CONTAINER_ID" > /dev/null
            test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_ID")" = false
          fi
          python3 - <<'PY'
          import hashlib, json, stat, subprocess
          from pathlib import Path
          out = Path('vm-debug-proof')
          out.mkdir(exist_ok=True)
          controls = Path('controls/.github/openclaw/qualification')
          files = sorted(out.iterdir()) + [controls / name for name in ('debug-vm-consumer.py', 'harness-adapters.json', 'harness-adapters/candidate-build.patch', 'harness-adapters/candidate-current-test.patch', 'harness-adapters/candidate-debug-local-build.patch')]
          assert 0 < len(files) <= 112 and all(stat.S_ISREG(p.lstat().st_mode) for p in files)
          assert sum(p.stat().st_size for p in files) <= 128 * 1024**2
          def sha(path):
              with path.open('rb') as stream: return hashlib.file_digest(stream, 'sha256').hexdigest()
          manifest = out / 'archive-manifest.json'
          manifest.write_text(json.dumps({str(p): {'bytes': p.stat().st_size, 'sha256': sha(p)} for p in files}, indent=2) + '\n')
          files.append(manifest)
          archive = Path('bun-vm-debug-proof.tar.gz.partial')
          subprocess.run(['tar', '-czf', str(archive), '--', *map(str, files)], check=True)
          assert archive.stat().st_size <= 32 * 1024**2
          archive.rename('bun-vm-debug-proof.tar.gz')
          Path('bun-vm-debug-SHA256SUMS').write_text(sha(Path('bun-vm-debug-proof.tar.gz')) + '  bun-vm-debug-proof.tar.gz\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: current-bun-vm-debug-proof
          path: |
            bun-vm-debug-proof.tar.gz
            bun-vm-debug-SHA256SUMS
          if-no-files-found: error
          retention-days: 7
