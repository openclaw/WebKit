name: OpenClaw Darwin watcher qualification

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: darwin-watcher-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 115
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      OPENCLAW_CI_PLATFORM: darwin
    steps:
      - name: Verify the retained engine artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/openclaw/WebKit/actions/artifacts/13932845152 --jq .workflow_run.id)" = 43185117369
          test "$(gh api repos/openclaw/WebKit/actions/artifacts/13932845152 --jq .workflow_run.head_sha)" = bcb792d40469dbcfbca2f57f637de0ba6f7097ca
          test "$(gh api repos/openclaw/WebKit/actions/artifacts/13932845152 --jq .digest)" = sha256:d465ab9108ebdac570f13982902f61a576760f35e40ae6def9eda17b9060ffe7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bcb792d40469dbcfbca2f57f637de0ba6f7097ca
          path: engine
          persist-credentials: false
          sparse-checkout: .github
      - name: Record the diagnostic candidate overlay
        run: |
          mkdir -p consumer
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path("engine")
          path=root/".github/openclaw/variants.json"
          config=json.loads(path.read_text())
          assert config["candidate"]["commit"]=="a03e7c861fc9461f7126b5120e236cacf53566f7"
          config["candidate"]["commit"]="dd694cf4c8226ffb24821b6184b1c15ac36c76b7"
          config["candidate"]["tree"]="b60f7b8898514913a8125bef65707996fcd88bff"
          path.write_text(json.dumps(config,indent=2)+"\n")
          path=root/".github/openclaw/qualification/harness-adapters.json"
          adapters=json.loads(path.read_text())
          assert adapters["arms"]["candidate"]["pin"]=="a03e7c861fc9461f7126b5120e236cacf53566f7"
          adapters["arms"]["candidate"]["pin"]=config["candidate"]["commit"]
          path.write_text(json.dumps(adapters,indent=2)+"\n")
          patch=subprocess.check_output(["git","-C","engine","diff","--binary","HEAD"])
          pathlib.Path("consumer/controller.patch").write_bytes(patch)
          receipt={"controllerSource":os.environ["GITHUB_SHA"],
                   "engineSource":"bcb792d40469dbcfbca2f57f637de0ba6f7097ca",
                   "candidateSource":config["candidate"]["commit"],"candidateTree":config["candidate"]["tree"],
                   "artifact":13932845152,"artifactRun":43185117369,
                   "artifactSHA256":"d465ab9108ebdac570f13982902f61a576760f35e40ae6def9eda17b9060ffe7",
                   "configurationPatchSHA256":hashlib.sha256(patch).hexdigest(),
                   "complete":False,"shippingArchiveQualified":False}
          pathlib.Path("consumer/controller.json").write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - name: Read the frozen Bun candidate
        id: consumer
        run: python3 -c 'import json,os; p=json.load(open("engine/.github/openclaw/variants.json"))["candidate"]; print("commit="+p["commit"],file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/bun
          ref: ${{ steps.consumer.outputs.commit }}
          path: consumer/bun
          persist-credentials: false
      - uses: ./consumer/bun/.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Read the candidate toolchain pins
        id: pins
        working-directory: consumer/bun
        run: |
          # shellcheck disable=SC2016
          bun -e 'import { pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm=${pins.llvm.version.split(".")[0]}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_MAJOR: ${{ steps.pins.outputs.llvm }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
          python3 -c 'import hashlib; assert callable(hashlib.file_digest)'
          brew install cmake ninja nasm ccache go llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          "$llvm_bin/clang" --version | grep -F "clang version ${LLVM_MAJOR}."
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_bin/clang++" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 13932845152
          run-id: 43185117369
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/darwin-artifact
      - name: Build and qualify the exact native Darwin candidate
        working-directory: engine
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/darwin-artifact
          QUALIFICATION_DIR: ${{ github.workspace }}/consumer
        run: |
          export INSPECTOR_RUNTIME="$(python3 -c 'import pathlib,shutil; print(pathlib.Path(shutil.which("bun")).resolve())')"
          bash .github/openclaw/qualify-darwin.sh
      - name: Verify the diagnostic result identity
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("consumer")
          receipt=json.loads((root/"controller.json").read_text())
          identity=json.loads((root/"candidate-identity.json").read_text())
          gate=json.loads((root/"gate.json").read_text())
          assert identity["candidate"]["commit"]==receipt["candidateSource"]
          assert identity["candidate"]["tree"]==receipt["candidateTree"]
          assert identity["runtime"]["bun_revision"]==receipt["candidateSource"]
          assert identity["runtime"]["webkit"]==receipt["engineSource"]
          assert gate["passed"] is True and gate["source"]==receipt["engineSource"]
          assert gate["selected_files"]==53
          receipt["complete"]=True
          (root/"controller.json").write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: darwin-repair-bun-executables-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/consumer/bun/build/qualify-candidate/bun
            ${{ github.workspace }}/consumer/bun/test/js/node/worker_threads/openclaw-resource-limits.test.ts
            ${{ github.workspace }}/consumer/bun/test/aot/every-platform.test.ts
            ${{ github.workspace }}/consumer/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: darwin-repair-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/consumer/*.json
            ${{ github.workspace }}/consumer/*.log
            ${{ github.workspace }}/consumer/*.patch
            ${{ github.workspace }}/consumer/candidate-input/artifacts.json
            ${{ github.workspace }}/consumer/candidate/*.json
            ${{ github.workspace }}/consumer/candidate/*.log
            ${{ github.workspace }}/consumer/sync/*.log
          if-no-files-found: error
          retention-days: 7
