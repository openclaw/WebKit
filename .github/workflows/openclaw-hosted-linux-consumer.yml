name: OpenClaw hosted Linux consumer qualification

on:
  pull_request:
    paths:
      - .github/workflows/openclaw-hosted-linux-consumer.yml
      - .github/openclaw/qualification/resume-consumer.py
      - .github/openclaw/qualification/continue-consumer.py
      - .github/openclaw/qualification/probe-allocator.cpp
      - .github/openclaw/qualification/consumer-repair.json
      - .github/openclaw/qualification/harness-adapters.json
      - .github/openclaw/qualification/harness_adapters.py
      - .github/openclaw/qualification/harness-adapters/**
      - .github/openclaw/variants.json
      - .github/openclaw/qualify-sync.sh
      - .github/openclaw/qualification/verify-sync.py
  workflow_dispatch:
    inputs:
      assemble_retained:
        description: Assemble the completed fixed-run matrix after Linux replay
        type: boolean
        default: false
      contracts_only:
        description: Run only packaging and consumer contracts
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: openclaw-hosted-linux-consumer-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SYNC_COMMIT: 42e4245f4180941634b482a7e8ef7fca47467de5
  CARRIER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Check the combined packaging and consumer contracts
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          mkdir "$RUNNER_TEMP/contracts"
          for suite in test_artifacts.py test_release.py test_consumer_identity.py test_compare_fork_ci.py test_verify_jsc_results.py; do
            python3 ".github/openclaw/$suite" 2>&1 | tee "$RUNNER_TEMP/contracts/${suite%.py}.log"
          done
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          config = json.loads(Path('.github/openclaw/variants.json').read_text())
          assert len(config['lanes']) == 21
          assert config['candidate']['commit'] == 'd9be087429c21e563bb5ac29f8a11805e64b56a3'
          paths = ['artifacts.py', 'test_artifacts.py', 'release.py', 'test_release.py', 'variants.json']
          controls = {name: hashlib.sha256(Path('.github/openclaw', name).read_bytes()).hexdigest() for name in paths}
          Path(os.environ['RUNNER_TEMP'], 'contracts', 'gate.json').write_text(json.dumps({
              'passed': True, 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'lanes': 21, 'archives': 22, 'controls': controls,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integrated-packaging-contracts
          path: ${{ runner.temp }}/contracts
          if-no-files-found: warn
          retention-days: 7
  linux-native:
    needs: contracts
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.assemble_retained && !inputs.contracts_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 42e4245f4180941634b482a7e8ef7fca47467de5
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/*
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
            /JSTests/stress/
            /JSTests/modules/
            /JSTests/*.yaml
            /JSTests/BUN-TEST-DIFFERENCES.md
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5e586e4ce8bd9f3f3703af98983f7f13fb58c242
          persist-credentials: false
          path: carrier
          fetch-depth: 1
          sparse-checkout: .github/openclaw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/bun
          ref: d9be087429c21e563bb5ac29f8a11805e64b56a3
          fetch-depth: 1
          persist-credentials: false
          path: retained-bun-source
      - name: Prepare the fixed-run continuation workspace
        shell: bash
        run: |
          set -euo pipefail
          export ARTIFACT_DIR="$RUNNER_TEMP/linux-artifact" QUALIFICATION_DIR="/home/runner/_work/_temp/qualification"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"
          echo "QUALIFICATION_DIR=$QUALIFICATION_DIR" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /opt/microsoft
          df -h /
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          capacity = dict(cpus=os.cpu_count(), disk_free_bytes=shutil.disk_usage('.').free)
          assert capacity['disk_free_bytes'] >= 40 * 1024**3, 'retained source, executables and engine need 40 GiB free'
          Path(os.environ['QUALIFICATION_DIR']).mkdir(parents=True)
          Path(os.environ['QUALIFICATION_DIR'], 'carrier.json').write_text(json.dumps(dict(
              carrier=os.environ['CARRIER_COMMIT'], sync=os.environ['SYNC_COMMIT'],
              engine_artifact=13075718771, engine_run=41286392252, engine_attempt=1,
              capacity=capacity), indent=2) + '\n')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Verify the frozen candidate Node version
        run: test "$(node --version)" = v26.12.1
      - name: Admit the exact retained engine artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/openclaw/WebKit/actions/artifacts/13075718771 > "$RUNNER_TEMP/engine-artifact.json"
          gh api repos/openclaw/WebKit/actions/artifacts/13075718771/zip > "$RUNNER_TEMP/engine.zip"
          python3 - <<'PY'
          import hashlib, json, os, shutil, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP'])
          artifact = json.loads((root / 'engine-artifact.json').read_text())
          digest = 'e762b6e8022b4d0f454b1ddc8288f0b3b2ad511b159fe2b8cff7fd4a4eb197d4'
          assert artifact['id'] == 13075718771 and not artifact['expired']
          assert artifact['name'] == 'bun-webkit-linux-amd64'
          assert artifact['workflow_run']['id'] == 41286392252
          assert artifact['workflow_run']['head_sha'] == 'bfea5fad536fe27d6beb39bdf64106536418428f'
          assert artifact['size_in_bytes'] == (root / 'engine.zip').stat().st_size == 709340274
          assert artifact['digest'] == 'sha256:' + digest
          with (root / 'engine.zip').open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest
          target = Path(os.environ['ARTIFACT_DIR'])
          target.mkdir()
          with zipfile.ZipFile(root / 'engine.zip') as archive:
              entries = archive.infolist()
              assert 0 < len(entries) <= 32 and sum(e.file_size for e in entries) <= 8 * 1024**3
              (Path(os.environ['QUALIFICATION_DIR']) / 'engine-zip-entries.json').write_text(json.dumps([
                  {'path': e.filename, 'bytes': e.file_size, 'mode': e.external_attr >> 16, 'directory': e.is_dir()}
                  for e in entries
              ], indent=2) + '\n')
              seen_paths, seen_files = set(), set()
              for entry in entries:
                  name = PurePosixPath(entry.filename)
                  parts = entry.filename.rstrip('/').split('/')
                  assert not name.is_absolute() and not any(p in ('', '.', '..') for p in parts)
                  assert '\\' not in entry.filename and '\x00' not in entry.filename and name not in seen_paths
                  seen_paths.add(name)
                  mode = stat.S_IFMT(entry.external_attr >> 16)
                  if entry.is_dir():
                      assert mode in (0, stat.S_IFDIR) and entry.file_size == 0
                      continue
                  assert mode in (0, stat.S_IFREG) and name.name not in seen_files
                  seen_files.add(name.name)
                  with archive.open(entry) as source, (target / name.name).open('xb') as output:
                      shutil.copyfileobj(source, output)
          from sys import path
          path.insert(0, '.github/openclaw/qualification')
          from consumer_identity import engine_input
          engine_input(target / 'bun-webkit-linux-amd64.tar.gz', target / 'bun-webkit-linux-amd64.manifest.json', os.environ['SYNC_COMMIT'])
          shutil.copyfile(root / 'engine-artifact.json', Path(os.environ['QUALIFICATION_DIR']) / 'engine-artifact.json')
          (root / 'engine.zip').unlink()
          PY
      - name: Install the frozen Bun and JSC test tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build nasm ccache golang-go clang-23 lld-23 llvm-23 unzip ruby ruby-highline libjson-pp-perl
          rustup toolchain install nightly-2026-09-15 --profile minimal --component rust-src
          echo 'RUSTUP_TOOLCHAIN=nightly-2026-09-15' >> "$GITHUB_ENV"
          echo '/usr/lib/llvm-23/bin' >> "$GITHUB_PATH"
          curl -fSL --retry 5 https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip -o "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bootstrap"
          echo "$RUNNER_TEMP/bootstrap/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Download the exact completed build and runtime evidence
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/retained"
          gh api repos/openclaw/WebKit/actions/artifacts/13077667443 > "$RUNNER_TEMP/retained/proof.metadata.json"
          gh api repos/openclaw/WebKit/actions/artifacts/13077667443/zip > "$RUNNER_TEMP/retained/proof.zip"
          gh api repos/openclaw/WebKit/actions/artifacts/13077208926 > "$RUNNER_TEMP/retained/binaries.metadata.json"
          gh api repos/openclaw/WebKit/actions/artifacts/13077208926/zip > "$RUNNER_TEMP/retained/binaries.zip"
      - name: Install the reviewed continuation and unchanged consumer policy
        shell: bash
        run: |
          set -euo pipefail
          python3 carrier/.github/openclaw/qualification/resume-consumer.py install "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/carrier"
      - name: Verify contracts with the reviewed adapters
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SYNC_COMMIT"
          python3 .github/openclaw/test_artifacts.py
          python3 .github/openclaw/test_compare_fork_ci.py
          python3 .github/openclaw/test_release.py
          python3 .github/openclaw/test_consumer_identity.py
          python3 .github/openclaw/test_verify_jsc_results.py
          bash .github/openclaw/preflight.sh
      - name: Replay the consumer suites against the retained matrix build
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          export INSPECTOR_RUNTIME="$(realpath "$(command -v bun)")"
          python3 carrier/.github/openclaw/qualification/resume-consumer.py replay-matrix \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/carrier" "$RUNNER_TEMP/retained" \
            "$QUALIFICATION_DIR" "$ARTIFACT_DIR" "$GITHUB_WORKSPACE/retained-bun-source" "$INSPECTOR_RUNTIME"
          export CANDIDATE_BUN="$QUALIFICATION_DIR/bun/build/qualify-candidate/bun"
          export CANDIDATE_RECEIPT="$QUALIFICATION_DIR/candidate-identity.json"
          bash "$QUALIFICATION_DIR/qualify-retained-matrix.sh"
          bash .github/openclaw/qualify-sync-compatibility.sh
          bash .github/openclaw/qualify-sync.sh
          python3 carrier/.github/openclaw/qualification/resume-consumer.py seal-matrix \
            "$GITHUB_WORKSPACE" "$QUALIFICATION_DIR" "$ARTIFACT_DIR" "$INSPECTOR_RUNTIME"
      - name: Retain the exact qualified Bun executables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-linux-bun-executables
          path: |
            /home/runner/_work/_temp/qualification/bun-baseline/build/qualify-baseline/bun
            /home/runner/_work/_temp/qualification/bun/build/qualify-candidate/bun
            /home/runner/_work/_temp/qualification/bun/build/qualify-candidate/obj/vendor/mimalloc/src/static.c.o
            /home/runner/_work/_temp/qualification/bun/test/js/node/worker_threads/openclaw-resource-limits.test.ts
            /home/runner/_work/_temp/qualification/*.sha256
          compression-level: 0
          if-no-files-found: warn
          retention-days: 3
      - name: Retain terminal or partial qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-linux-native-proof
          path: |
            /home/runner/_work/_temp/qualification/*.json
            /home/runner/_work/_temp/qualification/*.log
            /home/runner/_work/_temp/qualification/*.sha256
            /home/runner/_work/_temp/qualification/*.patch
            /home/runner/_work/_temp/qualification/qualify-retained-matrix.sh
            /home/runner/_work/_temp/qualification/candidate-input/artifacts.json
            /home/runner/_work/_temp/qualification/baseline/*.json
            /home/runner/_work/_temp/qualification/baseline/*.log
            /home/runner/_work/_temp/qualification/candidate/*.json
            /home/runner/_work/_temp/qualification/candidate/*.log
            /home/runner/_work/_temp/qualification/previous-candidate/*
            /home/runner/_work/_temp/qualification/compatibility/*.log
            /home/runner/_work/_temp/qualification/sync/*.json
            /home/runner/_work/_temp/qualification/sync/*.xml
            /home/runner/_work/_temp/qualification/sync/*.log
            /home/runner/_work/_temp/qualification/jsc-*/results
            /home/runner/_work/_temp/qualification/jsc-stack/*.log
            /home/runner/_work/_temp/qualification/jsc-stack/*.json
            /home/runner/_work/_temp/qualification/sync/runtime-cache/*.json
          if-no-files-found: error
          retention-days: 7
  assemble-retained:
    if: ${{ inputs.assemble_retained }}
    uses: ./.github/workflows/openclaw-retained-matrix.yml
