name: OpenClaw Node TLS session proof
on:
  pull_request:
    paths:
      - .github/workflows/openclaw-node-session.yml
      - .github/openclaw/qualification/node-session/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openclaw-node-session-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source-proof:
    if: >-
      github.repository == 'openclaw/WebKit' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'claude/node-session-constructor-proof-20261031') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/claude/node-session-constructor-proof-20261031'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: carrier
          persist-credentials: false
          sparse-checkout: .github/openclaw/qualification/node-session
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nodejs/node
          ref: d44625a4b80c672215b469906ce583ce7eeeebaf
          path: node-source
          persist-credentials: false
      - name: Prove the constructor fix on real Node builds
        shell: bash
        run: >-
          python3 carrier/.github/openclaw/qualification/node-session/qualify.py
          "$GITHUB_WORKSPACE/node-source" "$RUNNER_TEMP/node-session-proof"
      - name: Pack bounded evidence after either outcome
        if: always()
        shell: bash
        run: >-
          python3 carrier/.github/openclaw/qualification/node-session/qualify.py --pack
          "$RUNNER_TEMP/node-session-proof" "$RUNNER_TEMP/node-session-proof.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-node-session-proof
          path: ${{ runner.temp }}/node-session-proof.tar.gz
          if-no-files-found: warn
          retention-days: 7
