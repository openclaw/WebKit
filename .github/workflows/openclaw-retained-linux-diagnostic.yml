name: OpenClaw retained Debug failure and remaining-gate diagnostic
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux-x64:
    if: github.repository == 'openclaw/WebKit' && github.ref == 'refs/heads/claude/bun-c6a7-aot-debug-repairs-20261102'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
          sparse-checkout: |
            .github/openclaw/qualification/current-debug-replay.py
            .github/openclaw/qualification/aot-debug-repair
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 097247bced3ff346a39e6b699ba707ad63a9cd07
          path: snapshot-controls
          persist-credentials: false
          sparse-checkout: .github/openclaw/qualification
      - name: Acquire the frozen Bun type declarations and lockfile
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 snapshot-controls/.github/openclaw/qualification/acquire-bun-snapshot.py source
      - name: Admit the retained Debug executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,stat,subprocess,zipfile
          from pathlib import Path
          def get(route):
              # gh strips API authorization when following the signed artifact redirect.
              return subprocess.check_output(["gh","api","repos/openclaw/WebKit/"+route])
          run=json.loads(get("actions/runs/41403914224"))
          assert run["head_sha"]=="a8f9875aa8bc094d9e27d445dee98c1597082c57" and run["conclusion"]=="failure"
          row=json.loads(get("actions/artifacts/13124226627"))
          assert not row["expired"] and row["name"]=="current-bun-aot-debug-executable" and row["size_in_bytes"]==1700143548
          assert row["workflow_run"]["id"]==41403914224
          assert row["workflow_run"]["head_sha"]==run["head_sha"] and row["digest"]=="sha256:5e2e6325294a93e96105476e20e7cc4fe72df78a563b6884f31f80dee8bd937c"
          raw=get("actions/artifacts/13124226627/zip")
          assert len(raw)==1700143548 and hashlib.sha256(raw).hexdigest()=="5e2e6325294a93e96105476e20e7cc4fe72df78a563b6884f31f80dee8bd937c"
          z=zipfile.ZipFile(io.BytesIO(raw)); assert z.testzip() is None
          assert len(z.infolist())==1
          item=z.infolist()[0]
          assert Path(item.filename).name=="bun-debug" and not item.filename.startswith("/") and ".." not in Path(item.filename).parts
          assert 0<item.file_size<2*1024**3 and not stat.S_ISLNK(item.external_attr>>16)
          target=Path("retained-bun")
          with z.open(item) as source,target.open("wb") as sink:
              while data:=source.read(1024**2): sink.write(data)
          target.chmod(0o755)
          PY
      - name: Replay measured Debug failures and remaining gates
        run: |
          set -euo pipefail
          mkdir -p debug-replay-proof
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            docker.io/library/debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
            sh -euc 'apt-get update >/dev/null; apt-get install --yes --no-install-recommends python3 git ca-certificates libicu76 libatomic1 >/dev/null; unset CI BUILDKITE GITHUB_ACTIONS GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; git config --global --add safe.directory /work/source; python3 /work/controls/.github/openclaw/qualification/current-debug-replay.py'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: retained-debug-debug-replay-proof
          path: debug-replay-proof
          if-no-files-found: error
          retention-days: 7
