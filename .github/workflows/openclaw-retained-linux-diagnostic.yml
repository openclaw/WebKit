name: OpenClaw retained Debug mock path diagnostic
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  linux-x64:
    if: github.repository == 'openclaw/WebKit' && github.ref == 'refs/heads/claude/bun-c6a7-aot-debug-repairs-20261102'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
          sparse-checkout: .github/openclaw/qualification/current-mock-path-probe.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 097247bced3ff346a39e6b699ba707ad63a9cd07
          path: snapshot-controls
          persist-credentials: false
          sparse-checkout: .github/openclaw/qualification
      - name: Acquire the frozen Bun type declarations and lockfile
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 snapshot-controls/.github/openclaw/qualification/acquire-bun-snapshot.py source
      - name: Admit the retained Debug executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,stat,urllib.request,zipfile
          from pathlib import Path
          def get(route):
              request=urllib.request.Request("https://api.github.com/repos/openclaw/WebKit/"+route,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(request) as r: return r.read()
          run=json.loads(get("actions/runs/41396456930"))
          assert run["head_sha"]=="1047ca3631645484e812e55b6a665413941f9879" and run["conclusion"]=="failure"
          row=json.loads(get("actions/artifacts/13120786072"))
          assert not row["expired"] and row["name"]=="current-bun-aot-debug-executable" and row["size_in_bytes"]==1700157004
          assert row["workflow_run"]["id"]==41396456930
          raw=get("actions/artifacts/13120786072/zip")
          assert len(raw)==1700157004 and hashlib.sha256(raw).hexdigest()=="8485099bd006b7dc7111e6cd7536e4e77cee1214512a2b1875478edd59805032"
          z=zipfile.ZipFile(io.BytesIO(raw)); assert z.testzip() is None
          assert len(z.infolist())==1
          item=z.infolist()[0]
          assert Path(item.filename).name=="bun-debug" and not item.filename.startswith("/") and ".." not in Path(item.filename).parts
          assert 0<item.file_size<2*1024**3 and not stat.S_ISLNK(item.external_attr>>16)
          target=Path("retained-bun")
          with z.open(item) as source,target.open("wb") as sink:
              while data:=source.read(1024**2): sink.write(data)
          target.chmod(0o755)
          PY
      - name: Probe the actual ordinary and AOT mock boundary
        run: |
          set -euo pipefail
          mkdir -p mock-path-proof
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            docker.io/library/debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
            sh -euc 'apt-get update >/dev/null; apt-get install --yes --no-install-recommends python3 git ca-certificates libicu76 libatomic1 >/dev/null; unset CI BUILDKITE GITHUB_ACTIONS GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; git config --global --add safe.directory /work/source; python3 /work/controls/.github/openclaw/qualification/current-mock-path-probe.py'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: retained-debug-mock-path-proof
          path: mock-path-proof
          if-no-files-found: error
          retention-days: 7
