name: OpenClaw repaired Bun Node reference
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openclaw-c6-node-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference:
    if: github.repository == 'openclaw/WebKit' && github.ref == 'refs/heads/claude/bun-c6-node-reference-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/openclaw
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.12.1'
      - name: Acquire the exact unchanged Bun fixture source
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          mkdir reference-proof
          python3 .github/openclaw/qualification/acquire-bun-snapshot.py source > reference-proof/source.json
      - name: Observe the pinned Node reference through the real fixtures
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 - <<'PY'
          import hashlib, json, subprocess, tempfile
          from pathlib import Path
          source = Path('source').resolve()
          out = Path('reference-proof').resolve()
          def git(*args):
              return subprocess.check_output(['git', '-C', str(source), *args], text=True, timeout=30).strip()
          assert git('rev-parse', 'HEAD') == 'c6a7bf9d8dc4d44db9f826e47a5ae7645ea6e8c9'
          assert not git('status', '--porcelain', '--untracked-files=no')
          node = subprocess.check_output(['which', 'node'], text=True).strip()
          version = subprocess.check_output([node, '--version'], text=True).strip()
          assert version == 'v26.12.1'
          fixture = source / 'test/js/node/module/register-hooks-parity.fixture.mjs'
          assert hashlib.sha256(fixture.read_bytes()).hexdigest() == '296acaaa7cad638d68a8ae365f498d9acff57576fcf2600773984dac25905e59'
          records = []
          for mode in ['static-cycle-import', 'static-cycle-require', 'stat-noentry']:
              target = source / 'test/js/node/fs/fixtures/stat-noentry-oracle.mjs' if mode == 'stat-noentry' else fixture
              with tempfile.TemporaryDirectory(prefix='node-reference-') as directory:
                  argv = [node, str(target)] + ([directory] if mode == 'stat-noentry' else [mode, directory])
                  result = subprocess.run(argv, capture_output=True, text=True, timeout=30)
              assert len(result.stdout.encode()) + len(result.stderr.encode()) < 1024**2
              (out / (mode + '.stdout.log')).write_text(result.stdout)
              (out / (mode + '.stderr.log')).write_text(result.stderr)
              records.append({'mode': mode, 'argv': argv, 'exit_code': result.returncode,
                              'stdout': result.stdout, 'stderr': result.stderr,
                              'fixture_sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
          receipt = {'reference_only': True, 'node': version, 'node_sha256': hashlib.sha256(Path(node).read_bytes()).hexdigest(),
                     'bun_source': git('rev-parse', 'HEAD'), 'records': records}
          (out / 'reference.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt), flush=True)
          assert all(row['exit_code'] == 0 and row['stderr'] == '' for row in records), 'reference fixture failed; no parity verdict'
          assert records[-1]['stdout'] == 'stat oracle passed\n'
          assert all(set(json.loads(row['stdout'])) == {'answer', 'leafResolves'} and json.loads(row['stdout'])['answer'] == 42 for row in records[:-1])
          assert not git('status', '--porcelain', '--untracked-files=no')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: c6-node-reference-proof
          path: reference-proof
          retention-days: 7
          if-no-files-found: error
