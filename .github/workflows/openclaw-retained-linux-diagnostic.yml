---
name: OpenClaw current Bun scoped format repair qualification
'on':
  workflow_dispatch: 
permissions:
  contents: read
concurrency:
  group: openclaw-bun-source-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'openclaw/WebKit' && github.ref == 'refs/heads/claude/bun-c6-source-format-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 1047ca3631645484e812e55b6a665413941f9879
        path: controls
        persist-credentials: false
        sparse-checkout: ".github/openclaw"
    - name: Admit the exact C6 signed snapshot
      run: |
        set -euo pipefail
        mkdir -p source-format-proof
        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
        python3 controls/.github/openclaw/qualification/acquire-bun-snapshot.py source > source-format-proof/source-acquisition.json
    - uses: "./source/.github/actions/setup-bun"
      with:
        bun-version: 1.4.4
    - name: Install the source-pinned formatter toolchains
      env:
        RUSTUP_TOOLCHAIN: nightly-2026-09-15
      run: |
        set -euo pipefail
        rustup toolchain install nightly-2026-09-15 --profile minimal --component rustfmt
        echo RUSTUP_TOOLCHAIN=nightly-2026-09-15 >> "$GITHUB_ENV"
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends clang-format-23
    - name: Check the repaired Rust and C++ formatting
      run: |
        set -euo pipefail
        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
        python3 - <<'PY'
        import base64,difflib,hashlib,json,pathlib,re,subprocess
        root=pathlib.Path.cwd();source=root/"source";out=root/"source-format-proof";out.mkdir(exist_ok=True)
        owner=root/"controls/.github/openclaw/qualification/aot-debug-repair"
        manifest=json.loads((owner/"source-manifest.json").read_text())
        state={"passed":False,"source":manifest["bun"],"engine":manifest["engine"],"checks":{}}
        applied=[];format_applied=False
        format_patch=base64.b64decode('')
        format_files={'src/jsc/ModuleLoader.rs': {'before': '071070975aeb0768cd25f9d6811b25a241543504c235c3be003c947a680f9331', 'after': 'e22e34ed43338f6c6be7aa92dc4580eb6f6c722fb6fd82b0d52af2a38785c36f'}, 'src/jsc/VirtualMachine.rs': {'before': 'feea6b75ef6fe75a72413a821ff1dcfc6961bd63addbef3c8d26fd549ed8061b', 'after': 'fb84f24619ba7345161d95fcb4a89cb6ab8108ce752de86c62922a9bc6335b51'}, 'src/jsc/bindings/ZigGlobalObject.cpp': {'before': '777dd9afae816ac5aa90f7b960e0ae1e2d4cba64b36542dc8ad4781b6730ca18', 'after': 'a7a8b3a3954e617a95aaaa5b70c69f3b9e8c1da84de30823a3b3d75f62ab9bfb'}}
        assert hashlib.sha256(format_patch).hexdigest()=='d156b07c4cce205ae2c61eaa43dec7db3e97a021a6392fe6be5543c75cb166e5'
        def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
        def git(*args):return subprocess.check_output(["git","-C",str(source),*args],text=True).strip()
        def save():(out/"proof.json").write_text(json.dumps(state,indent=2)+"\n")
        def run(name,args):
         with (out/(name+".log")).open("wb") as f:p=subprocess.run(args,cwd=source,stdout=f,stderr=subprocess.STDOUT)
         log=out/(name+".log");assert log.stat().st_size<=8*1024**2
         state["checks"][name]={"argv":args,"exit_code":p.returncode,"log_bytes":log.stat().st_size,"sha256":sha(log)};save()
         return p.returncode
        save()
        assert git("rev-parse","HEAD")==manifest["bun"] and git("rev-parse","HEAD^{tree}")==manifest["bun_tree"] and not git("status","--porcelain")
        assert subprocess.check_output(["git","-C","controls","rev-parse","HEAD"],text=True).strip()=="1047ca3631645484e812e55b6a665413941f9879"
        try:
         for name,row in manifest["groups"].items():
          if row["repo"]!="source":continue
          patch=owner/name;assert sha(patch)==row["sha256"]
          for path,v in row["files"].items():assert sha(source/path)==v["before"]
          subprocess.run(["git","-C",str(source),"apply","--check",str(patch)],check=True)
          subprocess.run(["git","-C",str(source),"apply",str(patch)],check=True);applied.append((name,row))
          for path,v in row["files"].items():assert sha(source/path)==v["after"]
         files={p:v["after"] for _,row in applied for p,v in row["files"].items()}
         assert len(files)==12 and set(git("diff","--name-only").splitlines())==set(files)
         state["preformat_source_files"]=dict(files)
         for path,row in format_files.items():assert sha(source/path)==row["before"]
         subprocess.run(["git","-C",str(source),"apply","--check","-"],input=format_patch,check=True)
         subprocess.run(["git","-C",str(source),"apply","-"],input=format_patch,check=True);format_applied=True
         for path,row in format_files.items():
          assert sha(source/path)==row["after"];files[path]=row["after"]
         state["source_files"]=files
         state["format_patch_sha256"]=hashlib.sha256(format_patch).hexdigest()
         state["reused_js_format"]={'run': 41397216619, 'artifact_id': 13119798107, 'zip_sha256': 'ee63ceabecf06414f031782bb6025db8195b427e0e7e6efb716021d014039971', 'proof_sha256': 'c8a8388c1912056a576871ce8989df33a406c15a891f0320cc247ef6aaa6033f', 'check': {'argv': ['bunx', '--no-install', 'prettier', '--check', 'test/js/bun/plugin/plugins.test.ts', 'test/js/node/module/node-module-module.test.js', 'test/aot/run-aot.test.ts', 'test/js/node/vm/vm.test.ts'], 'exit_code': 0, 'log_bytes': 66, 'sha256': '17aa973d3f004560237d9a95171210b0671deff23d61628eecf7322ff5938f20'}, 'source_files': {'test/js/bun/plugin/plugins.test.ts': '8f9564e69bac5f1a3622f7fe74c54a68bbe4f6884016b4d190d281d8d590ae6b', 'test/js/node/module/node-module-module.test.js': 'a7f0f6ab3a18b9e15ac5629eacdbe42a4657fd1d52304dc38c5bf92b1da761cc', 'test/aot/run-aot.test.ts': '84c969401b9e0ddcc4a99d37096c4466dbfb312f63ca0f7864639f0ce23ca698', 'test/js/node/vm/vm.test.ts': '1c6f7f9afd4a4919bf41f3a9a82b92509bdf9ac16da82c865de6e8bf65735d7b'}}
         assert state["reused_js_format"]["check"]["exit_code"]==0
         assert {path:files[path] for path in files if path.endswith((".ts",".js"))}==state["reused_js_format"]["source_files"]
         save()
         assert run("install-root",["bun","install","--frozen-lockfile"])==0
         rust=[p for p in files if p.endswith(".rs")]
         cpp=[p for p in files if p.endswith(".cpp")]
         js=[p for p in files if p.endswith((".ts",".js"))]
         assert len(rust)==4 and len(cpp)==3 and len(js)==4
         assert run("rustfmt-version",["rustfmt","--version"])==0
         assert run("clang-format-version",["clang-format-23","--version"])==0
         checks=[("rust-format",["rustfmt","--edition","2024","--config","skip_children=true","--check",*rust],rust),
                 ("cpp-format",["clang-format-23","--dry-run","--Werror",*cpp],cpp)]
         failed=[]
         for name,args,paths in checks:
          if run(name,args)!=0:failed.append((name,paths))
         proposals=""
         for kind,paths in failed:
          for path in paths:
           p=source/path;before=p.read_bytes()
           if kind=="rust-format":args=["rustfmt","--edition","2024","--config","skip_children=true",path]
           elif kind=="cpp-format":args=["clang-format-23","-i",path]
           else:args=["bunx","--no-install","prettier","--write",path]
           try:
            rc=run("proposal-"+path.replace("/","_"),args)
            after=p.read_bytes()
            if rc==0:proposals+="".join(difflib.unified_diff(before.decode().splitlines(True),after.decode().splitlines(True),fromfile="a/"+path,tofile="b/"+path))
           finally:p.write_bytes(before)
         if proposals:(out/"format-only.patch").write_text(proposals)
         assert all(sha(source/path)==digest for path,digest in files.items())
         state["passed"]=not failed
        finally:
         state["restored"]=False
         if format_applied:
          subprocess.run(["git","-C",str(source),"apply","--reverse","--check","-"],input=format_patch,check=True)
          subprocess.run(["git","-C",str(source),"apply","--reverse","-"],input=format_patch,check=True)
          for path,row in format_files.items():assert sha(source/path)==row["before"]
         for name,row in reversed(applied):
          subprocess.run(["git","-C",str(source),"apply","--reverse","--check",str(owner/name)],check=True)
          subprocess.run(["git","-C",str(source),"apply","--reverse",str(owner/name)],check=True)
          for path,v in row["files"].items():assert sha(source/path)==v["before"]
         assert not git("diff","--name-only") and not git("diff","--cached","--name-only")
         assert git("rev-parse","HEAD")==manifest["bun"]
         state["restored"]=True;save()
        assert state["passed"],"scoped format checks failed; proposed mechanical diff retained"
        PY
    - name: Seal bounded format evidence
      if: always()
      run: |
        python3 - <<'PY'
        import hashlib,json,pathlib,stat
        out=pathlib.Path("source-format-proof");out.mkdir(exist_ok=True)
        files=sorted(out.iterdir())
        assert 0<len(files)<=64 and all(stat.S_ISREG(p.lstat().st_mode) for p in files)
        assert sum(p.stat().st_size for p in files)<=32*1024**2
        (out/"archive-manifest.json").write_text(json.dumps({p.name:{"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in files},indent=2)+"\n")
        PY
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: current-bun-scoped-format-proof
        path: source-format-proof/
        if-no-files-found: error
        retention-days: 7
