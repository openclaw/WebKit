name: OpenClaw retained matrix assembly

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openclaw-retained-matrix-41286392252
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 42e4245f4180941634b482a7e8ef7fca47467de5
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github
            Source/JavaScriptCore/COPYING.LIB
            Source/WTF/wtf/COPYING.LIB
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: carrier
          sparse-checkout: .github/openclaw
      - name: Admit the fixed builds and completed Linux replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 carrier/.github/openclaw/qualification/assemble-retained-matrix.py "$RUNNER_TEMP/inputs"
      - name: Install reviewed controls and assemble checked artifacts
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          python3 carrier/.github/openclaw/qualification/resume-consumer.py install "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/carrier"
          python3 .github/openclaw/release.py assemble --source 42e4245f4180941634b482a7e8ef7fca47467de5 --inputs "$RUNNER_TEMP/inputs" --directory "$RUNNER_TEMP/assembled"
          python3 .github/openclaw/release.py verify --source 42e4245f4180941634b482a7e8ef7fca47467de5 --directory "$RUNNER_TEMP/assembled"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retained-matrix-assembly
          path: ${{ runner.temp }}/assembled
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: retained-matrix-assembly-inputs
          path: |
            ${{ runner.temp }}/inputs/assembly-inputs.json
            ${{ runner.temp }}/assembled/manifest.json
            ${{ runner.temp }}/assembled/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
